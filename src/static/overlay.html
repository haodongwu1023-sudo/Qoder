<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>悬浮双语字幕</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b7cff'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%F0%9F%A6%8E%3C/text%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: rgba(16, 18, 24, 0.95);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .titlebar {
      -webkit-app-region: drag;
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 11px; gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px; color: #9aa3b2; flex-shrink: 0;
    }
    .title-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
    #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .timer {
      font-variant-numeric: tabular-nums; font-size: 10.5px; font-weight: 600;
      padding: 1px 6px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.06); color: #cbd5e1;
    }
    .controls { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    select {
      background: #1d2028; color: #e5e7eb; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; font-size: 11px; padding: 2.5px 5px; outline: none;
    }
    .titlebar button {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); color: #cbd5e1;
      cursor: pointer; font-size: 11px; font-weight: 500; padding: 3px 7px; border-radius: 6px;
      transition: all 0.15s ease; white-space: nowrap;
    }
    .titlebar button:hover:not(:disabled) { background: rgba(43,124,255,0.22); border-color: rgba(43,124,255,0.45); color: #fff; }
    .titlebar button[aria-pressed="true"] { background: rgba(239,68,68,0.22); border-color: rgba(239,68,68,0.45); color: #fca5a5; }
    .titlebar button.mode-orig { background: rgba(245,158,11,0.20); border-color: rgba(245,158,11,0.48); color: #fcd34d; }
    .titlebar button.mode-trans { background: rgba(34,197,94,0.16); border-color: rgba(34,197,94,0.42); color: #86efac; }
    .titlebar button:disabled { opacity: 0.42; cursor: not-allowed; }
    .content {
      flex: 1; padding: 8px 11px; display: flex; flex-direction: column;
      gap: 7px; overflow-y: auto;
    }
    .lane {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px; padding: 6px 10px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .lane.inbound { border-color: rgba(34, 197, 94, 0.22); background: rgba(34, 197, 94, 0.04); }
    .lane-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10.5px; color: #94a3b8; cursor: pointer;
    }
    .lane-badge {
      display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: #93c5fd;
    }
    .lane.inbound .lane-badge { color: #86efac; }
    .lane-toggle {
      background: transparent; border: none; color: #94a3b8; font-size: 11px; cursor: pointer; padding: 0 4px;
    }
    .lane-body { display: flex; flex-direction: column; gap: 2px; }
    .lane.collapsed .lane-body { display: none; }
    .src {
      font-size: 12px; color: #9ca3af; line-height: 1.32;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tgt {
      font-size: 14.5px; font-weight: 600; color: #ffffff; line-height: 1.34;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .wave { display: inline-flex; align-items: center; gap: 2px; height: 12px; vertical-align: middle; flex-shrink: 0; }
    .wave i { display: block; width: 2.5px; height: 3px; border-radius: 2px; background: #34d399; transition: height 0.08s ease; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="title-left">
      <span id="status">⚪ 已暂停</span>
      <span id="elapsedTimer" class="timer">00:00</span>
      <span class="wave" id="wave"><i id="w1"></i><i id="w2"></i><i id="w3"></i><i id="w4"></i></span>
    </div>
    <div class="controls">
      <select id="ovSrc" onchange="syncLangs()">
        <option value="zh">我: 中</option><option value="yue">我: 粤</option><option value="en">我: EN</option><option value="ja">我: 日</option><option value="ko">我: 韩</option><option value="fr">我: FR</option><option value="de">我: DE</option><option value="es">我: ES</option><option value="ru">我: RU</option><option value="pt">我: PT</option><option value="it">我: IT</option><option value="ar">我: AR</option><option value="th">我: TH</option><option value="vi">我: VI</option><option value="id">我: ID</option><option value="ms">我: MS</option><option value="tr">我: TR</option><option value="pl">我: PL</option><option value="cs">我: CS</option><option value="ro">我: RO</option><option value="nl">我: NL</option>
      </select>
      <span>→</span>
      <select id="ovTgt" onchange="syncLangs()">
        <option value="en" selected>译: EN</option><option value="zh">译: 中</option><option value="yue">译: 粤</option><option value="ja">译: 日</option><option value="ko">译: 韩</option><option value="fr">译: FR</option><option value="de">译: DE</option><option value="es">译: ES</option><option value="ru">译: RU</option><option value="pt">译: PT</option><option value="it">译: IT</option><option value="ar">译: AR</option><option value="th">译: TH</option><option value="vi">译: VI</option><option value="id">译: ID</option><option value="ms">译: MS</option><option value="tr">译: TR</option><option value="pl">译: PL</option><option value="cs">译: CS</option><option value="ro">译: RO</option><option value="nl">译: NL</option>
      </select>
      <button type="button" id="passthroughBtn" class="mode-orig" onclick="togglePassthrough()" title="切换对方声道：原声 vs 译音">👂 原声</button>
      <button type="button" id="muteBtn" onclick="toggleMicrophone()" aria-pressed="false">关麦</button>
      <button type="button" id="stopOverlayBtn" onclick="stopFromOverlay()" disabled>停止</button>
      <button type="button" onclick="closeOverlay()" title="关闭悬浮字幕">✕</button>
    </div>
  </div>
  <div class="content">
    <div id="outLane" class="lane">
      <div class="lane-head" onclick="toggleLane('out')">
        <span class="lane-badge">🎙️ 我在说</span>
        <button type="button" id="outToggleBtn" class="lane-toggle" aria-label="折叠我的字幕">▾</button>
      </div>
      <div class="lane-body">
        <div id="srcText" class="src">等待我的语音输入...</div>
        <div id="tgtText" class="tgt">开启同传后，这里实时置顶显示我说的双语字幕</div>
      </div>
    </div>
    <div id="inbLane" class="lane inbound">
      <div class="lane-head" onclick="toggleLane('inb')">
        <span class="lane-badge">🎧 对方在说</span>
        <button type="button" id="inbToggleBtn" class="lane-toggle" aria-label="折叠对方字幕">▾</button>
      </div>
      <div class="lane-body">
        <div id="inbSrcText" class="src">等待对方/系统音频...</div>
        <div id="inbTgtText" class="tgt">开启双向同传时，这里独立显示对方的实时双语字幕</div>
      </div>
    </div>
  </div>
  <script>
    let muted = false;
    let passthroughInbound = false;
    let sessionRunning = false;
    let timerStartedAt = 0;
    let timerInterval = null;
    const collapsed = { out: false, inb: false };
    const hasTargetInTurn = { outbound: false, inbound: false };

    function isMessageReady(msgStr) {
      const s = String(msgStr || '');
      return (s.includes('翻译和麦克风已就绪') || s.includes('继续同传中') || s.includes('已连接') || s.includes('同传运行中'))
        && !s.includes('正在连接') && !s.includes('等待') && !s.includes('重连') && !s.includes('收尾');
    }

    function updateTimerUI() {
      const el = document.getElementById('elapsedTimer');
      if (!sessionRunning || !timerStartedAt) {
        el.textContent = '00:00';
        return;
      }
      const secs = Math.max(0, Math.floor((Date.now() - timerStartedAt) / 1000));
      const mm = String(Math.floor(secs / 60)).padStart(2, '0');
      const ss = String(secs % 60).padStart(2, '0');
      el.textContent = `${mm}:${ss}`;
    }

    function setTimerRunning(running) {
      sessionRunning = !!running;
      if (sessionRunning) {
        if (!timerStartedAt) timerStartedAt = Date.now();
        if (!timerInterval) timerInterval = setInterval(updateTimerUI, 1000);
        updateTimerUI();
      } else {
        timerStartedAt = 0;
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        updateTimerUI();
      }
    }

    function toggleLane(which) {
      collapsed[which] = !collapsed[which];
      const lane = document.getElementById(which === 'out' ? 'outLane' : 'inbLane');
      const btn = document.getElementById(which === 'out' ? 'outToggleBtn' : 'inbToggleBtn');
      lane.classList.toggle('collapsed', collapsed[which]);
      btn.textContent = collapsed[which] ? '▸' : '▾';
      const targetHeight = (collapsed.out ? 36 : 96) + (collapsed.inb ? 36 : 96) + 46;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.set_overlay_height) {
        window.pywebview.api.set_overlay_height(targetHeight);
      }
    }

    function renderPassthrough(enabled) {
      passthroughInbound = !!enabled;
      const btn = document.getElementById('passthroughBtn');
      btn.textContent = passthroughInbound ? '👂 原声' : '🔊 译音';
      btn.className = passthroughInbound ? 'mode-orig' : 'mode-trans';
    }

    async function togglePassthrough() {
      const btn = document.getElementById('passthroughBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/session/passthrough', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({enabled: !passthroughInbound}),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderPassthrough(Boolean(data.enabled));
      } catch (_) {
        document.getElementById('status').textContent = '⚠️ 未能切换原声/译音';
      } finally {
        btn.disabled = false;
      }
    }

    async function stopFromOverlay() {
      const button = document.getElementById('stopOverlayBtn');
      button.disabled = true;
      try {
        const res = await fetch('/api/session/stop', {method: 'POST'});
        if (!res.ok) throw new Error();
      } catch (_) {
        document.getElementById('status').textContent = '⚠️ 未能停止同传';
      } finally {
        await syncOverlayStatus();
      }
    }

    function renderMute(value) {
      muted = !!value;
      const button = document.getElementById('muteBtn');
      button.textContent = muted ? '开麦' : '关麦';
      button.setAttribute('aria-pressed', String(muted));
    }

    async function toggleMicrophone() {
      const button = document.getElementById('muteBtn');
      button.disabled = true;
      try {
        const res = await fetch('/api/session/microphone', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({muted: !muted}),
        });
        if (!res.ok) throw new Error();
        renderMute((await res.json()).muted);
      } catch (_) {
        document.getElementById('status').textContent = '⚠️ 未能切换麦克风';
      } finally {
        button.disabled = false;
      }
    }

    function closeOverlay() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.hide_overlay();
      }
    }

    async function syncLangs() {
      await fetch('/api/session/languages', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source_lang: document.getElementById('ovSrc').value,
          target_lang: document.getElementById('ovTgt').value,
        })
      });
    }

    async function syncOverlayStatus() {
      try {
        const res = await fetch('/api/session/status');
        if (!res.ok) return;
        const st = await res.json();
        const ready = typeof st.ready === 'boolean' ? st.ready : isMessageReady(st.message);
        setTimerRunning(Boolean(st.running));
        document.getElementById('status').textContent = !st.running ? '⚪ 已暂停' : (ready ? '🟢 正在同传' : '🟡 连接中…');
        document.getElementById('stopOverlayBtn').disabled = !st.running || st.draining;
        renderMute(Boolean(st.microphone_muted));
        renderPassthrough(Boolean(st.passthrough_inbound));
        if (st.source_lang) document.getElementById('ovSrc').value = st.source_lang;
        if (st.target_lang) document.getElementById('ovTgt').value = st.target_lang;
      } catch (_) {}
    }

    function applySubtitleText(channel, role, text, isDelta) {
      const ch = channel === 'inbound' ? 'inbound' : 'outbound';
      const srcEl = document.getElementById(ch === 'inbound' ? 'inbSrcText' : 'srcText');
      const tgtEl = document.getElementById(ch === 'inbound' ? 'inbTgtText' : 'tgtText');
      if (role === 'source') {
        srcEl.textContent = text;
        if (!isDelta && !hasTargetInTurn[ch]) {
          tgtEl.textContent = '翻译中...';
        }
      } else if (role === 'target') {
        hasTargetInTurn[ch] = isDelta;
        tgtEl.textContent = text;
      }
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws/events`);
      ws.onopen = () => syncOverlayStatus();
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') {
          const ready = typeof msg.ready === 'boolean' ? msg.ready : isMessageReady(msg.message);
          setTimerRunning(Boolean(msg.running));
          document.getElementById('stopOverlayBtn').disabled = !msg.running || (msg.message || '').startsWith('正在收尾');
          document.getElementById('status').textContent = !msg.running ? '⚪ 已停止' : (ready ? '🟢 正在同传' : '🟡 连接中…');
          if (typeof msg.passthrough_inbound === 'boolean') renderPassthrough(msg.passthrough_inbound);
        } else if (msg.type === 'microphone_muted') {
          renderMute(msg.muted);
        } else if (msg.type === 'passthrough_updated') {
          renderPassthrough(Boolean(msg.enabled));
        } else if (msg.type === 'translation_connection') {
          const ready = typeof msg.ready === 'boolean' ? msg.ready : (msg.state === 'ready' && msg.input_ready !== false);
          if (sessionRunning) {
            document.getElementById('status').textContent = ready ? '🟢 同传已连接' : '🟡 正在连接/重连';
          }
        } else if (msg.type === 'mic_level') {
          const lv = msg.level || 0;
          const h = [0.45, 0.9, 0.7, 0.5];
          for (let i = 1; i <= 4; i++) {
            const bar = document.getElementById('w' + i);
            if (bar) bar.style.height = Math.max(3, Math.round(lv * 12 * h[i - 1])) + 'px';
          }
        } else if (msg.type === 'languages_updated') {
          document.getElementById('ovSrc').value = msg.source_lang;
          document.getElementById('ovTgt').value = msg.target_lang;
        } else if (msg.type === 'pipeline_stage') {
          if (msg.stage === 'asr') hasTargetInTurn[msg.channel === 'inbound' ? 'inbound' : 'outbound'] = false;
        } else if (msg.type === 'subtitle_delta') {
          applySubtitleText(msg.channel, msg.role, msg.text, true);
        } else if (msg.type === 'subtitle') {
          applySubtitleText(msg.channel, msg.role, msg.text, false);
        }
      };
      ws.onclose = () => setTimeout(connect, 1500);
    }
    syncOverlayStatus();
    connect();
  </script>
</body>
</html>
